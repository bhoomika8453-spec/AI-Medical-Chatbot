{% extends "base.html" %}
{% block title %}Edit Record — {{ patient.name }}{% endblock %}
{% block content %}

<div class="mb-4">
  <a href="{{ url_for('doctor.patient_records', patient_id=patient.id) }}"
     class="text-decoration-none text-muted small">
    <i class="bi bi-arrow-left me-1"></i>Back to {{ patient.name }}'s records
  </a>
</div>

<h3 class="mb-1"><i class="bi bi-pencil-square text-primary me-2"></i>Edit Medical Record</h3>
<p class="text-muted mb-4">Patient: <strong>{{ patient.name }}</strong> &mdash; {{ patient.email }}</p>

<div class="card border-0 shadow-sm" style="max-width:680px;">
  <div class="card-body p-4">
    <form method="POST">

      <div class="mb-3">
        <label class="form-label fw-semibold">Visit Date <span class="text-danger">*</span></label>
        <input type="date" name="visit_date" class="form-control"
               value="{{ record.visit_date.isoformat() }}" required/>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Symptoms</label>
        <input type="text" name="symptoms" class="form-control"
               value="{{ record.symptoms or '' }}"
               placeholder="fever, headache, fatigue (comma-separated)"/>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Diagnosis</label>
        <textarea name="diagnosis" class="form-control" rows="2">{{ record.diagnosis or '' }}</textarea>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Medicines Prescribed</label>
        <input type="text" name="medicines" class="form-control"
               value="{{ record.medicines or '' }}"
               placeholder="comma-separated"/>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Prescription Notes</label>
        <textarea name="prescription" class="form-control" rows="2">{{ record.prescription or '' }}</textarea>
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold">Doctor Notes</label>
        <textarea name="doctor_notes" class="form-control" rows="3">{{ record.doctor_notes or '' }}</textarea>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary rounded-pill px-4">
          <i class="bi bi-save me-1"></i>Update Record
        </button>
        <a href="{{ url_for('doctor.patient_records', patient_id=patient.id) }}"
           class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
      </div>

    </form>
  </div>
</div>

{% endblock %}
